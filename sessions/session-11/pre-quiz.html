<script src="../../js/quiz.js"></script>
<script>
  const session11PreQuizData = {
    title: "Session 11 Readiness: When Things Go Wrong",
    description: "Pick the closest answer. Explanations unlock after each response.",
    questions: [
      {
        question: "Your program divides by a number the user entered, and they entered 0. With no special handling, what happens?",
        options: [
          "It quietly returns 0",
          "It prints a stack trace (ArithmeticException) and the program stops",
          "The computer restarts",
          "Nothing; Java skips that line"
        ],
        correct: 1,
        explanation: "An unhandled exception unwinds to main, prints a trace, and terminates the program. Handling it lets you respond and keep going."
      },
      {
        question: "A user is asked for a number and types 'banana'. What is the SENSIBLE response?",
        options: [
          "Crash",
          "Catch the parse failure and ask them to try again",
          "Store 'banana' as the number",
          "Delete the program"
        ],
        correct: 1,
        explanation: "Bad user input is expected. Catch the exception, show a friendly message, and re-prompt — the program continues."
      },
      {
        question: "Which situation is a PROGRAMMING BUG rather than an expected external problem?",
        options: [
          "A file the program needs is missing",
          "The network is down",
          "The code calls a method on a variable that is null",
          "A database is temporarily unavailable"
        ],
        correct: 2,
        explanation: "NullPointerException usually means the code forgot to assign or check something. The others are external conditions to handle gracefully."
      },
      {
        question: "You open a file, read it, and want to be SURE it gets closed even if reading fails halfway. What concept helps?",
        options: [
          "A loop",
          "A block of cleanup code that always runs (finally), or better, try-with-resources",
          "A static method",
          "An interface"
        ],
        correct: 1,
        explanation: "finally always runs; try-with-resources goes further and closes the resource for you automatically."
      },
      {
        question: "You write your own exception type, InsufficientFundsException, so callers can react to that specific failure. This is:",
        options: [
          "Not possible in Java",
          "A custom exception — a class that extends Exception (or RuntimeException)",
          "A new keyword",
          "Only for the JDK team"
        ],
        correct: 1,
        explanation: "Any class extending Exception or RuntimeException is a usable exception type you can throw and catch by name."
      }
    ]
  };

  document.addEventListener('DOMContentLoaded', () => {
    quiz = new QuizEngine('quizContainer', session11PreQuizData);
  });
</script>
