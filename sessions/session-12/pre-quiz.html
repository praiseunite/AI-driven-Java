<script>
  const session12PreQuizData = {
    title: "Week 3 Warm-Up: Inheritance, Interfaces, Exceptions",
    description: "Quick recall. Explanations unlock after each answer.",
    questions: [
      {
        question: "`Animal a = new Dog(); a.speak();` where Dog overrides speak(). Which runs?",
        options: ["Animal.speak()", "Dog.speak()", "Both", "Neither"],
        correct: 1,
        explanation: "Dynamic dispatch picks the method by the object's real type (Dog), not the variable's declared type."
      },
      {
        question: "A class can extend ___ class(es) and implement ___ interface(s).",
        options: ["one / many", "many / one", "one / one", "many / many"],
        correct: 0,
        explanation: "Single class inheritance; any number of interfaces."
      },
      {
        question: "You must catch or declare which kind of exception?",
        options: ["Unchecked", "Checked", "Both", "Neither"],
        correct: 1,
        explanation: "The compiler enforces handling of checked exceptions (Exception subclasses that aren't RuntimeException)."
      },
      {
        question: "A method is full of `if (obj instanceof TypeA) ... else if (obj instanceof TypeB) ...`. The cleaner design is:",
        options: [
          "Add more instanceof checks",
          "Give the types a shared method (interface / override) and call it polymorphically",
          "Use a switch on the class name",
          "Make everything static"
        ],
        correct: 1,
        explanation: "Type-based branching usually means behaviour that belongs inside the objects as an overridden method."
      },
      {
        question: "`try (Resource r = ...) { ... }` guarantees:",
        options: [
          "The block runs at least once",
          "r.close() is called automatically at the end, even on exception",
          "No exceptions can occur",
          "The resource is deleted"
        ],
        correct: 1,
        explanation: "try-with-resources auto-closes any AutoCloseable declared in its header."
      }
    ]
  };

  document.addEventListener('DOMContentLoaded', () => {
    quiz = new QuizEngine('quizContainer', session12PreQuizData);
  });
</script>
