<script src="../../js/quiz.js"></script>
<script>
  const session8PreQuizData = {
    title: "Week 2 Warm-Up: Objects, Collections, Structure",
    description: "Quick recall. Explanations unlock after each answer.",
    questions: [
      {
        question: "`Dog a = new Dog(); Dog b = a;` — how many Dog objects exist?",
        options: ["Two", "One (a and b point at the same one)", "Zero", "Three"],
        correct: 1,
        explanation: "`new` was called once. `b = a` copies the reference, so both variables refer to the single object."
      },
      {
        question: "You need a list that starts empty and grows as items are added at runtime.",
        options: ["int[]", "ArrayList", "A single String", "A 2D array"],
        correct: 1,
        explanation: "Array length is fixed at creation; ArrayList grows and shrinks with add()/remove()."
      },
      {
        question: "A `static int totalOrders` is incremented in a constructor. It represents:",
        options: [
          "One order's data",
          "Data shared across the whole class — the running total of all orders ever created",
          "A local variable",
          "The order's price"
        ],
        correct: 1,
        explanation: "static fields have one shared copy belonging to the class, ideal for class-wide totals and counters."
      },
      {
        question: "Which is a field (no parentheses), not a method?",
        options: ["someString.length()", "someList.size()", "someArray.length", "someList.get(0)"],
        correct: 2,
        explanation: "Arrays expose `.length` as a field. String uses `.length()` and ArrayList uses `.size()` — both methods."
      },
      {
        question: "`package com.aptech.app;` appears at the top of a file. The file must be stored:",
        options: [
          "Anywhere",
          "In a folder path com/aptech/app/",
          "Next to the JDK",
          "In a file called app.java"
        ],
        correct: 1,
        explanation: "The directory structure must mirror the package name exactly."
      }
    ]
  };

  document.addEventListener('DOMContentLoaded', () => {
    quiz = new QuizEngine('quizContainer', session8PreQuizData);
  });
</script>
