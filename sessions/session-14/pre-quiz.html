<script src="../../js/quiz.js"></script>
<script>
  const session14PreQuizData = {
    title: "Session 14 Readiness: Modern Java Style",
    description: "Pick the closest answer. Explanations unlock after each response.",
    questions: [
      {
        question: "You want to pass 'a piece of behaviour' (e.g. 'keep items priced under 50') into a method. What lets you do that concisely?",
        options: [
          "A for-loop copied everywhere",
          "A lambda / function value",
          "A static field",
          "A comment"
        ],
        correct: 1,
        explanation: "Lambdas let behaviour be a value you store and pass around. A method can then accept different behaviours without being rewritten."
      },
      {
        question: "This loop filters a list, transforms each item, and collects the results. Modern Java expresses that as:",
        options: [
          "A nested try/catch",
          "A stream pipeline: source.stream().filter(...).map(...).collect(...)",
          "A recursive method",
          "A 2D array"
        ],
        correct: 1,
        explanation: "Streams turn filter/transform/collect loops into a readable declarative pipeline."
      },
      {
        question: "You keep writing tiny classes that just hold a few values plus equals/hashCode/toString. Modern Java gives you:",
        options: [
          "An interface",
          "A record — one line generates all of that",
          "A static method",
          "An enum"
        ],
        correct: 1,
        explanation: "`record Point(int x, int y) {}` auto-generates fields, constructor, accessors, and value-based equals/hashCode/toString."
      },
      {
        question: "A method might not find a result. Returning `null` risks a later NullPointerException. A safer return type is:",
        options: [
          "int",
          "Optional<Result>",
          "boolean",
          "String \"null\""
        ],
        correct: 1,
        explanation: "Optional makes 'maybe no value' explicit in the type, so callers must consciously handle the empty case."
      },
      {
        question: "`var total = 0;` — what is `total`'s type?",
        options: [
          "It has no type; it's dynamic",
          "int — the compiler infers it from the initialiser",
          "Object",
          "String"
        ],
        correct: 1,
        explanation: "`var` is compile-time type inference for local variables. The type is fixed (here int); it is not dynamic typing."
      }
    ]
  };

  document.addEventListener('DOMContentLoaded', () => {
    quiz = new QuizEngine('quizContainer', session14PreQuizData);
  });
</script>
