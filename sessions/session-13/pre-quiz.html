<script>
  const session13PreQuizData = {
    title: "Session 13 Readiness: Dates, Times, Zones",
    description: "Pick the closest answer. Explanations unlock after each response.",
    questions: [
      {
        question: "You need to store a person's birthday. Which is the most fitting concept?",
        options: [
          "A time of day (hours:minutes)",
          "A date with no time and no time zone",
          "A number of milliseconds",
          "A String like 'March-ish'"
        ],
        correct: 1,
        explanation: "A birthday is a plain calendar date — no clock time, no zone. That is exactly LocalDate."
      },
      {
        question: "Given Java's immutable types, what does `date.plusDays(7)` do to `date` itself?",
        options: [
          "Adds 7 days to date",
          "Nothing — it returns a NEW date; the original is unchanged",
          "Throws an exception",
          "Sets date to null"
        ],
        correct: 1,
        explanation: "Like String, java.time types never change. You must capture the result: date = date.plusDays(7)."
      },
      {
        question: "It is 3pm in Lagos. What time is it, at that same instant, in Tokyo (8 hours ahead)?",
        options: ["3pm", "7am", "11pm", "It is impossible to say"],
        correct: 2,
        explanation: "Same moment in time, different wall clocks. 3pm + 8h = 11pm in Tokyo. ZonedDateTime handles this conversion."
      },
      {
        question: "You want to show a date as 'Tuesday, 21 April 2026'. What do you need?",
        options: [
          "A loop over the characters",
          "A DateTimeFormatter with a pattern like 'EEEE, d MMMM yyyy'",
          "String concatenation of getYear() etc.",
          "The toString() default"
        ],
        correct: 1,
        explanation: "DateTimeFormatter.ofPattern(...) formats (and parses) date-time objects using letter patterns."
      },
      {
        question: "\"How many whole days until the deadline?\" is best answered with:",
        options: [
          "Subtracting two years",
          "ChronoUnit.DAYS.between(today, deadline)",
          "Counting in a loop",
          "A Duration in hours divided by 24 by hand"
        ],
        correct: 1,
        explanation: "ChronoUnit.<UNIT>.between(a, b) returns a single total in that unit — the clean way to get 'days between'."
      }
    ]
  };

  document.addEventListener('DOMContentLoaded', () => {
    quiz = new QuizEngine('quizContainer', session13PreQuizData);
  });
</script>
